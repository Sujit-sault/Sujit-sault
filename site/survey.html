        <main>
            <h1>Survey</h1>

            <!-- Survey Form -->
            <div id="survey-form">
                <form action="https://formspree.io/f/mqapzqgn"method="POST">
                    <!-- Control 1: Single-line Text Field -->
                    <p>
                        <label for="name_field">What is your name? <abbr title="required" aria-label="required">*</abbr></label>
                        <input type="text" id="name_field" name="name_field" required>
                    </p>

                    <!-- Control 2: Email Field -->
                    <p>
                        <label for="email_field">What is your email? <abbr title="required" aria-label="required">*</abbr></label>
                        <input type="email" id="email_field" name="email_field" required>
                    </p>

                    <!-- Control 3: Number Field -->
                    <p>
                        <label for="best_whole_number">Which whole number is best? <abbr title="required" aria-label="required">*</abbr></label>
                        <input type="number" id="best_whole_number" name="best_whole_number" min="1" required>
                    </p>

                    <!-- Control 4: Date Field -->
                    <p>
                        <label for="best_day">Which day is best?</label>
                        <input type="date" id="best_day" name="best_day">
                    </p>

                    <!-- Control 5: Dropdown List -->
                    <p>
                        <label for="best_bear">Which bear is best? <abbr title="required" aria-label="required">*</abbr></label>
                        <select id="best_bear" name="best_bear" required>
                            <option value=""> </option>
                            <option value="black">Black</option>
                            <option value="brown">Brown</option>
                            <option value="care">Care</option>
                            <option value="panda">Panda</option>
                            <option value="polar">Polar</option>
                            <option value="teddy">Teddy</option>
                        </select>
                    </p>

                    <!-- Control 6: Radio Buttons -->
                    <fieldset>
                        <legend>Do you like radio buttons? <abbr title="required" aria-label="required">*</abbr></legend>
                        <ul>
                            <li>
                                <label for="yes">Yes</label>
                                <input type="radio" id="yes" name="enjoys_radio_buttons" value="yes" required>
                            </li>
                            <li>
                                <label for="no">No</label>
                                <input type="radio" id="no" name="enjoys_radio_buttons" value="no" required>
                            </li>
                            <li>
                                <label for="none">None of your business</label>
                                <input type="radio" id="none" name="enjoys_radio_buttons" value="?" checked>
                            </li>
                        </ul>
                    </fieldset>

                    <!-- Control 7: Multi-line Text Field -->
                    <p>
                        <label for="life_meaning">What is the meaning of life?</label>
                        <textarea id="life_meaning" name="life_meaning" rows="5" cols="50" placeholder="Enter the correct answer here"></textarea>
                    </p>

                    <!-- Control 8: Submit Button -->
                    <p>
                        <button type="submit">Send</button>
                    </p>
                </form>
            </div>
        </main>
